# CI for both halves of the repo.
#
# Until refactor Phase 0 this file watched only `tools/**` and `apps/**`, so a change to
# Systems/, IO/ or Domain/ could not fail anything — including compilation. The producer now has
# a paths entry and a test project of its own, and the Python side runs `pytest` once instead of
# the thirteen commands someone remembered to list (18 of 31 test files ran nowhere at all).
#
# The C# MOD is still not built here and cannot be: Carto.dll targets net48 against the game's
# own Unity BCL and Game.dll, by absolute path out of a Steam install. `tests/Carto.Tests` links
# the game-free sources by <Compile Include> instead, which is why it builds on a runner.
name: ci

on:
  push:
    branches: [main]
    paths: &watched
      - "tools/**"
      - "apps/**"
      - "tests/**"
      - "Systems/**"
      - "IO/**"
      - "Domain/**"
      - "docs/example-bundle/**"
      - "docs/schema/**"
      - "pyproject.toml"
      - ".editorconfig"
      - "upstream-files.txt"
      - "Directory.Build.props"
      - "Directory.Build.targets"
      - "Carto.csproj"
      - ".github/workflows/ci.yml"
  pull_request:
    paths: *watched
  workflow_dispatch:

jobs:
  # Style, size and lint-debt. OS-independent, so once rather than across the matrix.
  gates:
    name: gates (lint, format, size, lint debt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # `check_limits.py --verify-upstream` reads the tree at the fork point (43a05fb) to
          # re-derive upstream-files.txt from authorship. A shallow clone has no such object.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip && python -m pip install ruff
      - name: ruff (lint)
        run: python -m ruff check
      - name: ruff (format is idempotent)
        run: python -m ruff format --check
      - name: The upstream boundary still matches git authorship
        run: python tools/check_limits.py --verify-upstream
      - name: No file over 400 lines, no function over 60 (allowlist shrinks only)
        run: python tools/check_limits.py
      - name: No local shadows an import (an UnboundLocalError ruff cannot see)
        run: python tools/check_shadows.py
      - name: Lint debt has not grown (ledger shrinks only)
        run: python -m pip install ruff && python tools/check_ruff_debt.py

  python:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pillow pytest
      # One command, all 31 test files. Anything that needs a real rip is marked `needs_rip` and
      # skips here, naming where it looked; anything that merely has MORE to say with a bundle
      # present reports "awaiting a rip" and still runs its offline half, by design.
      # Before the ten-minute suite: the one-second check that every `module.name` the two
      # shipped packages write still exists. A split moves an address without moving a line, and
      # this is the cheapest thing that notices.
      - name: Every cross-module reference resolves
        run: python tools/check_references.py
      - name: pytest
        run: python -m pytest -q
      - name: The generated settings reference is current
        run: python tools/gen_docs.py --check
      - name: Headless build of the example bundle
        shell: bash
        run: |
          python -m cs2beamng build docs/example-bundle --out "$RUNNER_TEMP/cs2_example" --set jobs=1
          test -f "$RUNNER_TEMP/cs2_example/cs2beamng_report.json"
          rm -rf docs/example-bundle/derived
      - name: Working tree is clean (no test wrote into the repo)
        shell: bash
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # The producer's only automated check. It cannot load the game's assemblies, so it links the
  # sources that touch no game type; adding a file to that list is a claim the compiler checks.
  mod:
    name: Carto.Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: dotnet test
        run: dotnet test tests/Carto.Tests -c Release --nologo

  # The gate that the editable install cannot give: `pip install .` builds a WHEEL, so anything
  # the app reaches through a path relative to the checkout is simply absent. Two real defects
  # lived behind that blind spot until 2026-08-20 - `stages/cook.py` imported `level_budget` out
  # of `tools/`, and Pillow was imported in two modules and declared in none - and both are
  # invisible to every test above, because `-e .` leaves the checkout on sys.path.
  #
  # So: install the wheel, leave the checkout, and build a level from an absolute path.
  wheel:
    name: wheel install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel (not editable)
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m pip install "$RUNNER_TEMP"/wheel/*.whl
      - name: Build from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          cs2beamng --version
          cs2beamng doctor || true                      # exit 1 here just means "no CS2 bundle"
          cs2beamng build "$GITHUB_WORKSPACE/docs/example-bundle" --out "$RUNNER_TEMP/cs2_wheel" --set jobs=1
          test -f "$RUNNER_TEMP/cs2_wheel/cs2beamng_report.json"
          # every stage module must import from the wheel, including the one that used to reach
          # into tools/ for level_budget
          python -c "from cs2beamng.stages import all_stages; print(len(all_stages()), 'stages')"
          python -c "from cs2beamng.beamng import budget; print(budget.LADDER_INDEX)"
      - name: The checkout is untouched
        shell: bash
        run: |
          rm -rf docs/example-bundle/derived
          git status --porcelain && test -z "$(git status --porcelain)"
