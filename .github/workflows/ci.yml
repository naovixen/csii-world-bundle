# Consumer-side CI: the Python packages (csiibundle + cs2beamng) on the three desktop OSes.
# The C# mod is not built here (it needs the CS2 modding toolchain and the game's assemblies).
#
# Every test below self-skips the parts that need a real rip; what runs on CI is the offline
# gate suite plus a headless `cs2beamng build` of docs/example-bundle — the A0 acceptance.
name: ci

on:
  push:
    branches: [main]
    paths:
      - "tools/**"
      - "apps/**"
      - "docs/example-bundle/**"
      - "docs/schema/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tools/**"
      - "apps/**"
      - "docs/example-bundle/**"
      - "docs/schema/**"
      - "pyproject.toml"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

jobs:
  python:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pillow
      - name: Offline gates (csiibundle)
        run: |
          python tools/test_bundle_contract.py
          python tools/test_glbwrite.py
          python tools/test_bake_manifest.py
          python tools/test_lod_collision.py
          python tools/test_b1_readers.py
          python tools/test_soup_surface.py
          python tools/test_bake_products.py
          python tools/test_png_decode.py
          python tools/test_normal_packing.py
      - name: App shell gate (runner / server / SSE / cancel / dead worker)
        run: python tools/test_app_shell.py
      # The real-build tier of this one cannot run here (it needs a level someone built); it
      # says so and skips. The arithmetic and selection tiers are the ones that catch a
      # regression in the sizing, and they need nothing but the checkout.
      - name: Cost estimate gate (DDS sizing, the mesh index, every figure's basis)
        run: python tools/test_estimate.py
      - name: The generated settings reference is current
        run: python tools/gen_docs.py --check
      - name: A1 gate (.ter, level tree, validator, water bands, terrain/scene stages)
        run: python tools/test_a1_level.py
      - name: A2 gate (COLLADA writer, materials v1.5, frame)
        run: python tools/test_a2_dae.py
      - name: Headless build of the example bundle
        shell: bash
        run: |
          python -m cs2beamng build docs/example-bundle --out "$RUNNER_TEMP/cs2_example" --set jobs=1
          test -f "$RUNNER_TEMP/cs2_example/cs2beamng_report.json"
          rm -rf docs/example-bundle/derived
      - name: Working tree is clean (no test wrote into the repo)
        shell: bash
        run: git status --porcelain && test -z "$(git status --porcelain)"

  # The gate that the editable install cannot give: `pip install .` builds a WHEEL, so anything
  # the app reaches through a path relative to the checkout is simply absent. Two real defects
  # lived behind that blind spot until 2026-08-20 - `stages/cook.py` imported `level_budget` out
  # of `tools/`, and Pillow was imported in two modules and declared in none - and both are
  # invisible to every test above, because `-e .` leaves the checkout on sys.path.
  #
  # So: install the wheel, leave the checkout, and build a level from an absolute path.
  wheel:
    name: wheel install / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install the wheel (not editable)
        shell: bash
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir "$RUNNER_TEMP/wheel"
          python -m pip install "$RUNNER_TEMP"/wheel/*.whl
      - name: Build from outside the checkout
        shell: bash
        working-directory: ${{ runner.temp }}
        run: |
          set -e
          cs2beamng --version
          cs2beamng doctor || true                      # exit 1 here just means "no CS2 bundle"
          cs2beamng build "$GITHUB_WORKSPACE/docs/example-bundle" --out "$RUNNER_TEMP/cs2_wheel" --set jobs=1
          test -f "$RUNNER_TEMP/cs2_wheel/cs2beamng_report.json"
          # every stage module must import from the wheel, including the one that used to reach
          # into tools/ for level_budget
          python -c "from cs2beamng.stages import all_stages; print(len(all_stages()), 'stages')"
          python -c "from cs2beamng.beamng import budget; print(budget.LADDER_INDEX)"
      - name: The checkout is untouched
        shell: bash
        run: |
          rm -rf docs/example-bundle/derived
          git status --porcelain && test -z "$(git status --porcelain)"
